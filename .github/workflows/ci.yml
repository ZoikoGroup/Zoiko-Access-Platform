# Active only when this folder is the root of its own Git repository.
name: ci
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: zoiko_test
          POSTGRES_USER: zoiko
          POSTGRES_PASSWORD: ci-only-not-a-secret
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U zoiko -d zoiko_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      POSTGRES_PASSWORD: ci-only-not-a-secret
      POSTGRES_HOST: localhost
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt
      - run: pip install -r requirements/dev.txt
      - name: Lint
        run: ruff check .
      - name: Architecture boundaries
        run: lint-imports
      - name: Type check
        run: mypy foundation modules config
      - name: Tests
        run: pytest
